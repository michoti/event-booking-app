name: event-booking

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

# `docker compose up -d`                  -> db + sweeper (run `npm run dev` on the host)
# `docker compose --profile app up -d`    -> + migrate + production-mode app container
services:
  db:
    # pgvector/pgvector ships the `vector` extension. pg_cron is a Supabase extension: locally the `sweeper` replaces it.
    image: pgvector/pgvector:pg17
    container_name: eb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventbooking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-eventbooking}
      TZ: UTC
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=128MB", "-c", "log_min_duration_statement=500"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [app-net]
    logging: *logging

  # Local stand-in for pg_cron: calls the same SQL function every 30 seconds.
  sweeper:
    image: pgvector/pgvector:pg17
    container_name: eb-sweeper
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until psql -h db -U $${POSTGRES_USER:-eventbooking} -d $${POSTGRES_DB:-eventbooking} -tAc "select to_regproc('sweep_expired') is not null" 2>/dev/null | grep -q t; do sleep 3; done
        while true; do
          psql -h db -U $${POSTGRES_USER:-eventbooking} -d $${POSTGRES_DB:-eventbooking} -tAc "select sweep_expired()" || true
          sleep 30
        done
    depends_on:
      db: { condition: service_healthy }
    networks: [app-net]
    logging: *logging

  migrate:
    profiles: [app]
    build: { context: ., target: migrator }
    image: event-booking-migrator:local
    container_name: eb-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventbooking}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-eventbooking}
    depends_on:
      db: { condition: service_healthy }
    networks: [app-net]
    logging: *logging

  app:
    profiles: [app]
    build:
      context: .
      target: runner
    image: event-booking-app:local
    container_name: eb-app
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventbooking}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-eventbooking}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_METRICS: ${ENABLE_METRICS:-0}
      METRICS_PORT: "9464"
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy: { resources: { limits: { cpus: "1.0", memory: 768M } } }
    networks: [app-net, obs-net]
    logging: *logging

networks:
  app-net: { name: eb-app-net }
  obs-net: { name: eb-obs-net }

volumes:
  pgdata:
