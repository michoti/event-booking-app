services:
  dev:
    image: node:26-slim
    container_name: eb-dev
    working_dir: /app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"   # files stay owned by you, not root
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-eventbooking}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:-eventbooking}
      AUTH_SECRET: ${AUTH_SECRET:?set in .env}
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      ALLOW_DEV_LOGIN: "1"
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      db: { condition: service_healthy }
    networks: [app-net]
    command:
      - sh
      - -c
      - |
        if [ ! -d node_modules ]; then
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
        fi
        npm run db:migrate && npm run db:seed && exec npm run dev